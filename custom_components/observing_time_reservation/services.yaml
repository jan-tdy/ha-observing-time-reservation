reserve:
  name: Reserve observing time
  description: Book a slot for the current user on a telescope, inside an admin-opened availability window.
  fields:
    config_entry_id:
      name: Telescope
      description: The telescope's config entry id.
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation
    start:
      name: Start
      required: true
      selector:
        datetime:
    end:
      name: End
      required: true
      selector:
        datetime:

cancel_reservation:
  name: Cancel reservation
  description: Cancel one of your own reservations (or any, if called by an admin).
  fields:
    config_entry_id:
      name: Telescope
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation
    reservation_id:
      name: Reservation ID
      required: true
      selector:
        text:

set_availability:
  name: Set availability window
  description: Admin-only. Replace the list of time windows during which this telescope can be booked.
  fields:
    config_entry_id:
      name: Telescope
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation
    windows:
      name: Windows
      description: List of {start, end} ISO datetime objects.
      required: true
      selector:
        object:

send_command:
  name: Send telescope command
  description: Dispatch an abstract capability (goto, park, start_capture, ...) to the entity mapped for it. Only works while you hold the active reservation.
  fields:
    config_entry_id:
      name: Telescope
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation
    capability:
      name: Capability
      required: true
      selector:
        select:
          options:
            - set_goto_ra
            - set_goto_dec
            - goto
            - stop_goto
            - park
            - unpark
            - set_tracking
            - start_capture
            - stop_capture
            - set_exposure
            - set_filter
            - set_focus
            - set_ccd_temperature
            - allow_power_actions
            - startup_sequence
            - shutdown
            - set_dew_heater
            - set_imaging_mode
            - start_live_view
            - start_mosaic
            - start_spectra
            - set_goto_target_label
            - set_gain
            - auto_focus
            - set_mag_declination
            - set_wide_camera
            - record_video
            - plate_solve_loop
            - run_plan
            - pause_plan
            - continue_plan
            - skip_target
            - reset_plan_item
    value:
      name: Value
      required: false
      selector:
        object:

start_sequence:
  name: Start exposure sequence
  description: Run a multi-step exposure plan (filter/exposure/count per step) one step after another. Only works while you hold the active reservation.
  fields:
    config_entry_id:
      name: Telescope
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation
    steps:
      name: Steps
      description: List of {filter, exposure, count, ccd_temperature, autofocus_every} objects, run in order. Only exposure/count are required (filter/ccd_temperature/autofocus_every are optional); autofocus_every triggers the auto_focus capability every Nth sub of that step, if mapped. exposure is in whatever unit the mapped set_exposure entity itself uses (seconds for a typical INDI camera, milliseconds for ha-seestar) - same as the single-shot exposure field.
      required: true
      selector:
        object:

pause_sequence:
  name: Pause exposure sequence
  description: Pause the currently running sequence after the in-progress exposure finishes.
  fields:
    config_entry_id:
      name: Telescope
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation

resume_sequence:
  name: Resume exposure sequence
  description: Resume a paused sequence.
  fields:
    config_entry_id:
      name: Telescope
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation

cancel_sequence:
  name: Cancel exposure sequence
  description: Stop the currently running or paused sequence.
  fields:
    config_entry_id:
      name: Telescope
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation

set_recording:
  name: Set frame recording
  description: Arm/disarm periodic frame saving for your current session.
  fields:
    config_entry_id:
      name: Telescope
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:

save_frame:
  name: Save a frame now
  description: Immediately save one frame from the telescope's preview camera into this session's folder.
  fields:
    config_entry_id:
      name: Telescope
      required: true
      selector:
        config_entry:
          integration: observing_time_reservation
