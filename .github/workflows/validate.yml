name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" (home-assistant/brands submission) and "topics" (repo
          # GitHub topics) are only required for inclusion in the default
          # HACS store; this is installed as a HACS custom repository, so
          # skip them rather than keep CI red over store-listing paperwork.
          ignore: "brands,topics"
