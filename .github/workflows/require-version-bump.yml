name: Require version bump

# Every PR into main must bump
# custom_components/observing_time_reservation/manifest.json's "version", so
# that merging always produces a new release (see release.yml).

on:
  pull_request:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Require a manifest.json version bump
        run: |
          if git show "origin/${{ github.base_ref }}:custom_components/observing_time_reservation/manifest.json" > /tmp/base_manifest.json 2>/dev/null; then
            base_version=$(python3 -c "import json; print(json.load(open('/tmp/base_manifest.json'))['version'])")
          else
            base_version="(integration not present on base branch)"
          fi
          head_version=$(python3 -c "import json; print(json.load(open('custom_components/observing_time_reservation/manifest.json'))['version'])")
          echo "base version: $base_version"
          echo "head version: $head_version"
          if [ "$base_version" = "$head_version" ]; then
            echo "::error file=custom_components/observing_time_reservation/manifest.json::version was not bumped (still $head_version). Every PR must bump it so the release workflow can cut a new release on merge."
            exit 1
          fi
