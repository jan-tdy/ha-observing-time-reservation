name: Release

# Fully automatic: every push to main is checked against
# custom_components/observing_time_reservation/manifest.json's "version". If
# that version has no release yet, this creates the vX.Y.Z tag and the
# GitHub Release for it - no manual `git tag && git push` step needed.
# A direct push of a "vX.Y.Z" tag is still supported for one-off/manual
# releases, and is cross-checked against the manifest the same way.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # This job pushes a tag below, so (unlike the read-only
          # validate/test workflows) it needs the checkout's persisted
          # credentials.

      - name: Read version from manifest.json
        id: manifest
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/observing_time_reservation/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            manifest_version="${{ steps.manifest.outputs.version }}"
            if [ "${tag#v}" != "$manifest_version" ]; then
              echo "::error::Tag $tag does not match manifest.json version $manifest_version"
              exit 1
            fi
          else
            tag="v${{ steps.manifest.outputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: tag_exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether a GitHub Release already exists
        id: release_exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: github.ref_type != 'tag' && steps.tag_exists.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.release_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.tag, 'b') || contains(steps.tag.outputs.tag, 'a') || contains(steps.tag.outputs.tag, 'rc') }}
